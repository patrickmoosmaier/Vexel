# Publishes VEXEL.nds as a GitHub release whenever a new ROM lands on main.
# The version number comes from the VERSION file (one release per version).
name: Release
on:
  push:
    branches: [main]
    paths: [VEXEL.nds, VERSION, RELEASE_NOTES.md]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: VEXEL v${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: VEXEL.nds
          make_latest: true
